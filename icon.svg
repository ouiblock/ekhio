<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#FFB800" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" rx="128" fill="#0F0A1E" />
  <!-- Sun Rays -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="140" fill="url(#sunGrad)" />
    <!-- Rays -->
    <path d="M256 40 L256 70 M256 442 L256 472 M40 256 L70 256 M442 256 L472 256 M103 103 L124 124 M388 388 L409 409 M103 409 L124 388 M388 103 L409 124" stroke="#FFB800" stroke-width="24" stroke-linecap="round" />
  </g>
  <!-- Robot head inside the sun -->
  <rect x="206" y="216" width="100" height="80" rx="16" fill="#0F0A1E" stroke="#FFB800" stroke-width="8" />
  <!-- Eyes -->
  <circle cx="236" cy="256" r="8" fill="#00D4FF" />
  <circle cx="276" cy="256" r="8" fill="#00D4FF" />
  <!-- Mouth -->
  <path d="M236 280 Q256 290 276 280" stroke="#00FF50" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Antenna -->
  <line x1="256" y1="216" x2="256" y2="196" stroke="#FFB800" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="188" r="10" fill="#FFB800" />
</svg>
