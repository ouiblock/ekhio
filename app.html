<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
<script>
// INITIALISATION PROFIL ET CONSENTEMENT EKHIO
if(!localStorage.getItem('ekhio_profiles') || !localStorage.getItem('ekhio_active_profile')) {
  window.location.replace('onboarding.html');
} else {
  const pid = localStorage.getItem('ekhio_active_profile');
  const profiles = JSON.parse(localStorage.getItem('ekhio_profiles') || '[]');
  window.__ekhioProfile = profiles.find(p => p.id === pid) || profiles[0];
  if(!window.__ekhioProfile) window.location.replace('onboarding.html');
  else {
    // Ensure age is numeric
    window.__ekhioProfile.age = parseInt(window.__ekhioProfile.age || 5, 10);
    localStorage.setItem('ekhio_active_profile', window.__ekhioProfile.id);
  }
}
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;background:var(--bg,#FFF9F0);color:var(--text,#1A1208);padding-bottom:100px;min-height:100dvh;overflow-x:hidden;}
button{cursor:pointer;background:none;border:none;font:inherit;}
ul{list-style:none;}
/* Age Colors */
:root {
  --age-color: #FFB800; /* Default Amber Sun */
  --bg: #FFF9F0;
  --surface: rgba(255, 255, 255, 0.7);
  --glass: rgba(255, 255, 255, 0.4);
  --border: rgba(15, 10, 30, 0.1);
  --text: #0F0A1E;
  --muted: #6B5B3E;
  --faint: #B8A898;
}

body {
  --midnight: #0F0A1E;
  --amber-sun: #FFB800;
  background: radial-gradient(circle at top, #FFF9F0 0%, #ede7df 100%);
  color: var(--text);
  padding-bottom: 110px;
  min-height: 100dvh;
  overflow-x: hidden;
}

body.dark {
  --bg: #0F0A1E;
  --surface: rgba(26, 16, 48, 0.8);
  --glass: rgba(26, 16, 48, 0.6);
  --border: rgba(255, 184, 0, 0.1);
  --text: #FFF;
  --muted: #B8A898;
  --faint: #4A3A6A;
  background: radial-gradient(circle at top, #1a142e 0%, #0F0A1E 100%);
}

.glass-card {
  background: var(--surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  box-shadow: 0 8px 32px 0 rgba(15, 10, 30, 0.05);
}

/* TOPBAR */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255, 184, 0, 0.9);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 4px 30px rgba(0,0,0,0.1); color: #0F0A1E;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}
.logo { display:flex; align-items:center; gap:10px; }
.logo-icon {
  width: 42px; height: 42px; background: #0F0A1E; border-radius: 14px;
  display: flex; align-items: center; justify-content: center; font-size: 24px;
  box-shadow: 0 4px 12px rgba(15, 10, 30, 0.2);
}
.logo h1 { font-family:'Fredoka One',cursive; font-size: 22px; line-height: 1; color: #0F0A1E; }
.topbar-btn-group { display:flex; gap:10px; }
.topbar-btn {
  width: 38px; height: 38px; background: rgba(15, 10, 30, 0.1); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; color: #0F0A1E; font-size: 18px;
  transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.topbar-btn:active { transform: scale(0.9); background: rgba(15, 10, 30, 0.2); }

/* MAIN WRAP */
.main{max-width:480px;margin:0 auto;padding:16px;}
.view{display:none;flex-direction:column;}
.view.act{display:flex;}
.sec-title{font-family:'Fredoka One',cursive;font-size:21px;color:var(--text);margin-bottom:14px;margin-top:20px;}

/* DASHBOARD */
.hero {
  background: linear-gradient(135deg, #1A1208, #2D1F0A);
  border-radius: 32px; padding: 30px 24px; margin-bottom: 24px;
  position: relative; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2); text-align: center;
  border: 1px solid rgba(255,255,255,0.1);
}
.hero::before {
  content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle at center, rgba(255,184,0,0.1) 0%, transparent 70%);
  pointer-events: none;
}
.star-counter {
  font-family: 'Fredoka One', cursive; font-size: 56px; color: var(--age-color);
  line-height: 1; margin-bottom: 8px; text-shadow: 0 0 30px rgba(255,184,0,0.5);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s;
}
.star-counter.pop { transform: scale(1.3); }
.star-label{font-size:12px;font-weight:800;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em;}
.robot-container{display:flex;justify-content:center;margin:60px 0 10px;height:180px;position:relative;transform:scale(0.95);}
.robot-bubble{position:absolute;bottom:100%;margin-bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#1A1208;padding:10px 16px;border-radius:18px;font-size:13px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:.3s;z-index:10;max-width:80%;text-align:center;}
.robot-bubble::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border-width:6px 6px 0;border-style:solid;border-color:#fff transparent transparent transparent;}
.daily-prog{background:rgba(255,255,255,.1);border-radius:999px;height:12px;overflow:hidden;margin-top:14px;}
.daily-fill{height:100%;background:var(--age-color);border-radius:999px;transition:width 0.6s cubic-bezier(0.22, 1, 0.36, 1);}
.daily-visual-stars { display: flex; justify-content: center; gap: 6px; margin-top: 10px; font-size: 20px; flex-wrap: wrap; }
.v-star { opacity: 0.2; transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); transform: scale(0.8); }
.v-star.on {
  opacity: 1; transform: scale(1.15);
  filter: drop-shadow(0 0 6px rgba(255,184,0,0.5));
  animation: starPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes starPop {
  0% { transform: scale(0.3); opacity: 0; }
  50% { transform: scale(1.4); }
  100% { transform: scale(1.15); opacity: 1; }
}
/* Glow pulse on active stars */
.v-star.on { animation: starGlow 2s ease-in-out infinite alternate; }
@keyframes starGlow {
  0% { filter: drop-shadow(0 0 4px rgba(255,184,0,0.3)); }
  100% { filter: drop-shadow(0 0 10px rgba(255,184,0,0.7)); }
}
@media (max-width: 380px) {
  .daily-visual-stars { font-size: 16px; gap: 4px; }
}

/* Confetti burst */
.confetti-burst {
  position: fixed; top: 50%; left: 50%; z-index: 9999; pointer-events: none;
}
.confetti-particle {
  position: absolute; width: 8px; height: 8px; border-radius: 2px;
  animation: confettiFall 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}
@keyframes confettiFall {
  0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
  100% { transform: translate(var(--cx), var(--cy)) rotate(720deg) scale(0); opacity: 0; }
}

/* GRID LISTS */
.beh-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.beh-card{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 2px 8px rgba(0,0,0,.06);position:relative;overflow:hidden;}
.beh-card:active{transform:scale(.96);}
.beh-card.done{opacity:0.4; pointer-events:none;}
/* Ripple effect */
.beh-card .ripple {
  position: absolute; border-radius: 50%; transform: scale(0);
  animation: rippleAnim 0.6s ease-out; background: rgba(255,184,0,0.25);
  pointer-events: none;
}
@keyframes rippleAnim {
  to { transform: scale(4); opacity: 0; }
}
    
/* PARENT FAB */
.fab-parent { 
  position: fixed; bottom: 100px; right: 20px; z-index: 1000;
  width: 56px; height: 56px; border-radius: 28px; background: var(--age-color);
  box-shadow: 0 4px 16px rgba(0,0,0,0.3); display: flex; align-items:center; justify-content:center;
  font-size: 24px; color: #0F0A1E; transition: .2s; border: 3px solid #FFF;
}
.fab-parent:active { transform: scale(0.9); }
.parent-tools-menu {
  position: fixed; bottom: 165px; right: 20px; z-index: 3000;
  background: var(--surface); border: 2.5px solid var(--age-color);
  border-radius: 20px; padding: 12px; display: none; flex-direction: column; gap: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25); min-width: 180px;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
}
.parent-tools-menu.open { display: flex !important; }
.ptm-btn {
  padding: 10px 14px; border-radius: 12px; background: rgba(0,0,0,0.05); text-align: left;
  font-weight: 800; font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 10px;
}
.ptm-btn:active { background: var(--age-color); color: #FFF; }

.beh-card.done::after{content:'✓';position:absolute;top:8px;right:10px;font-size:18px;color:#2ECC71;font-weight:900;}
.beh-card .ic{font-size:36px;margin-bottom:4px;}
.beh-card .lbl{font-size:12px;font-weight:800;color:var(--text);line-height:1.2;}
.beh-card .badge{background:var(--age-color);color:#fff;font-size:10px;font-weight:900;padding:3px 8px;border-radius:999px;}
.beh-card.chal{border-color:var(--age-color);background:rgba(255,184,0,.05);}

/* REWARDS */
.rew-item{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.2s;}
.rew-item.ul{border-color:#2ECC71;background:linear-gradient(135deg,#F0FFF7,#E0FFEE);cursor:pointer}
.rew-item.nx{border-color:var(--age-color);background:linear-gradient(135deg,#FFFBF0,#FFF3DC)}
.rew-item.lk{opacity:.6}
body.dark .rew-item.ul{background:linear-gradient(135deg,rgba(46,204,113,0.1),rgba(46,204,113,0.05));}
body.dark .rew-item.nx{background:linear-gradient(135deg,rgba(255,184,0,0.1),rgba(255,184,0,0.05));}
.rew-ic{font-size:32px;flex-shrink:0}
.rew-info{flex:1}
.rew-title{font-weight:800;font-size:14px;color:var(--text)}
.rew-desc{font-size:11px;color:var(--muted);margin-top:2px}
.rew-cost{font-family:'Fredoka One',cursive;font-size:18px;color:#E09800;flex-shrink:0}

/* BADGES */
.badges-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
.b-card { background:var(--surface); border:1.5px solid var(--border); border-radius:18px; padding:16px; text-align:center; position:relative; opacity:0.4; filter:grayscale(100%); transition:0.3s; }
.b-card.unlocked { opacity:1; filter:grayscale(0%); border-color:var(--age-color); box-shadow:0 4px 12px rgba(255,184,0,0.2); }
.b-card .b-em { font-size:40px; margin-bottom:8px; line-height:1; }
.b-card .b-ti { font-size:12px; font-weight:900; margin-bottom:4px; color:var(--text); }
.b-card .b-de { font-size:10px; color:var(--muted); line-height:1.2; }
.b-card .b-bonus { position:absolute; top:-8px; right:-8px; background:#E8344A; color:#FFF; font-weight:900; font-size:10px; padding:4px 8px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.2); }


/* PARENT / SETTINGS */
.s-card{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px}
.s-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.s-row:last-child{border-bottom:none}
.s-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;font-weight:700;background:var(--bg);margin-bottom:8px;color:var(--text);}
.s-input:focus{outline:none;border-color:var(--age-color);}
.btn-save{background:var(--age-color);color:#fff;border-radius:12px;padding:14px;font-weight:800;font-size:15px;width:100%;text-align:center;border:none;}

/* Language selector */
.lang-select {
  padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--border);
  background: var(--bg); color: var(--text); font: inherit; font-weight: 700;
  font-size: 14px; width: 140px; cursor: pointer;
}
.lang-select:focus { outline: none; border-color: var(--age-color); }

/* NAVIGATION */
.bottom-nav {
  position: fixed; bottom: 20px; left: 16px; right: 16px;
  background: rgba(255, 249, 240, 0.7);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(15, 10, 30, 0.05);
  display: flex; justify-content: space-around; padding: 10px 4px;
  border-radius: 28px;
  box-shadow: 0 8px 32px rgba(15, 10, 30, 0.15); z-index: 200;
}
body.dark .bottom-nav {
  background: rgba(26, 16, 48, 0.8);
  border-color: rgba(255, 184, 0, 0.1);
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-width: 48px; border-radius: 16px; color: var(--faint); font-size: 9px;
  font-weight: 800; text-transform: uppercase; transition: .3s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nav-item .ni { font-size: 22px; line-height: 1; transition: 0.3s; }
.nav-item.act { color: var(--age-color); }
.nav-item.act .ni { transform: translateY(-4px) scale(1.1); filter: drop-shadow(0 4px 8px rgba(255,184,0,0.4)); }
@media (max-width: 380px) {
  .nav-item { font-size: 8px; min-width: 40px; }
  .nav-item .ni { font-size: 20px; }
  .bottom-nav { padding: 8px 2px; bottom: 12px; left: 10px; right: 10px; }
}

.profile-selector{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;margin-bottom:10px;}
.p-sel-item{background:rgba(255,255,255,.1);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;min-width:85px;border:2px solid transparent;color:#fff;transition:0.3s;}
.p-sel-item.act{border-color:var(--age-color);background:rgba(255,255,255,0.2);box-shadow: 0 8px 24px rgba(0,0,0,0.2);}
.p-sel-item .av{width:44px;height:44px;border-radius:14px;margin-bottom:8px;background:var(--age-color);box-shadow: 0 4px 10px rgba(0,0,0,0.15);}
.p-sel-add{opacity:0.5;border:2px dashed rgba(255,255,255,0.3);}
.p-sel-add:hover{opacity:0.8;}

/* --- OVERLAYS & MODALS (GLASSMORPHISM) --- */
.overlay {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(15, 10, 30, 0.6);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 16px; opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.overlay.open {
  opacity: 1; pointer-events: all;
}
.modal {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 24px; padding: 24px;
  width: 100%; max-width: 400px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  transform: translateY(40px);
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-align: center;
}
.overlay.open .modal {
  transform: translateY(0);
}
.m-em {
  font-size: 48px; display: block; margin-bottom: 8px; line-height: 1;
}
.m-title {
  font-family: 'Fredoka One', cursive; font-size: 24px; margin-bottom: 8px; color: var(--text);
}
.m-desc {
  font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.5;
}
.m-actions {
  display: flex; gap: 12px;
}
.btn {
  flex: 1; padding: 12px; border-radius: 999px; font-weight: 800; font-size: 14px;
  text-align: center; cursor: pointer; transition: transform 0.15s, filter 0.15s;
  display: inline-flex; align-items: center; justify-content: center;
}
.btn:active { transform: scale(0.96); }
.btn-p {
  background: var(--age-color); color: #FFF;
  box-shadow: 0 4px 12px rgba(var(--robot-accent-rgb, 255,184,0), 0.3);
}
.btn-p:hover { filter: brightness(1.1); }
.btn-s {
  background: rgba(0,0,0,0.05); color: var(--muted);
}
body.dark .btn-s { background: rgba(255,255,255,0.08); color: var(--muted); }

/* --- PARENT PIN SPACE --- */
.pin-dots {
  display: flex; justify-content: center; gap: 16px; margin: 20px 0;
}
.pin-dot {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--faint); background: transparent;
  transition: background 0.2s, border-color 0.2s;
}
.pin-dot.fill {
  background: var(--age-color); border-color: var(--age-color);
  box-shadow: 0 0 10px var(--age-color);
}
.pin-pad {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  max-width: 280px; margin: 0 auto;
}
.pin-btn {
  aspect-ratio: 1; width: 70px; border-radius: 50%;
  background: rgba(0,0,0,0.04); color: var(--text);
  font-family: 'Fredoka One', cursive; font-size: 24px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, transform 0.1s;
}
body.dark .pin-btn { background: rgba(255,255,255,0.06); }
.pin-btn:active {
  background: var(--age-color); color: #0F0A1E; transform: scale(0.9);
}

/* --- SOS / BREATH GUIDE --- */
.breath-circle {
  width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle, var(--age-color) 0%, rgba(255,184,0,0.4) 100%);
  margin: 30px auto;
  box-shadow: 0 0 30px rgba(var(--robot-accent-rgb, 255,184,0), 0.5);
  animation: breathe 14s infinite ease-in-out;
}
@keyframes breathe {
  0%, 100% { transform: scale(0.7); filter: brightness(0.8); } /* Start Inhale (4s) */
  28.5% { transform: scale(1.3); filter: brightness(1.2); }    /* End Inhale (4s) */
  57.1% { transform: scale(1.3); filter: brightness(1.2); }    /* Hold (4s) */
  100% { transform: scale(0.7); filter: brightness(0.8); }     /* Exhale (6s) */
}

/* --- RULES --- */
.rule-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 16px; padding: 14px 18px; margin-bottom: 10px;
  display: flex; flex-direction: column; gap: 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.rule-title {
  font-weight: 800; font-size: 15px; color: var(--text);
}

/* --- HISTORY --- */
.hist-item {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 16px; padding: 12px 16px; display: flex; align-items: center;
  gap: 12px; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.hist-item.type-earn { border-left: 4px solid var(--age-color); }
.hist-item.type-use { border-left: 4px solid #E8344A; }

/* --- WEEK BAR --- */
.week-bar {
  display: flex; flex-direction: row; justify-content: center; gap: 8px;
  margin-bottom: 16px; padding: 8px 0; align-items: flex-start;
  flex-wrap: nowrap;
}
.w-day {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  min-width: 32px;
}
.wd-l {
  font-size: 11px; font-weight: 900; color: rgba(255,255,255,0.4);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.wd-d {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,0.08); display: flex;
  align-items: center; justify-content: center;
  font-size: 12px; opacity: 0.3; transition: 0.3s;
}
.w-day.act .wd-l { color: var(--age-color); }
.w-day.act .wd-d {
  opacity: 1; background: var(--age-color);
  box-shadow: 0 0 12px rgba(255,184,0,0.4);
  transform: scale(1.15);
}
@media (max-width: 380px) {
  .week-bar { gap: 4px; }
  .wd-l { font-size: 9px; }
  .wd-d { width: 24px; height: 24px; font-size: 10px; }

/* --- SOS BUTTON --- */
.sos-btn {
  position: absolute; top: 12px; right: 12px;
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(232, 52, 74, 0.2); border: 2px solid rgba(232, 52, 74, 0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; cursor: pointer; z-index: 10;
  transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  animation: sosPulse 2s infinite;
}
.sos-btn:active { transform: scale(0.9); }
@keyframes sosPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(232,52,74,0.3); }
  50% { box-shadow: 0 0 0 8px rgba(232,52,74,0); }
}

/* --- GAME LOCKED --- */
.game-locked {

}

}

/* --- GAME CANVAS --- */
#gameCanvas {

  background: var(--bg); display: block; margin: 0 auto;

}

// Renvoie la tranche-clé selon l'âge
function getAgeKey(age) {
  let a = parseInt(age, 10);
  if (isNaN(a)) a = 5; // fallback
  if(a <= 6) return '3-6';
  if(a <= 12) return '7-12';
  return '13-18';
}

// Consolidate & Deduplicate Profiles by Name
function dedupeProfiles() {
  let all = JSON.parse(localStorage.getItem('ekhio_profiles')||'[]');
  let seen = new Set();
  let unique = [];
  all.forEach(p => {
    let key = p.name.toLowerCase().trim() + "_" + p.age;
    if(!seen.has(key)) {
      seen.add(key);
      unique.push(p);
    }
  });
  if(unique.length < all.length) {
    localStorage.setItem('ekhio_profiles', JSON.stringify(unique));
  }
}

let S = {};

function syncState() {
  S = {
    stars: parseInt(localStorage.getItem(SK_STARS)||'0'),
    bank: parseInt(localStorage.getItem(SK_BANK)||'0'),
    behs: JSON.parse(localStorage.getItem(SK_BEH)||'null'),
    rews: JSON.parse(localStorage.getItem(SK_REW)||'null'),
    hist: JSON.parse(localStorage.getItem(SK_HIST)||'[]'),
    rules: JSON.parse(localStorage.getItem(SK_RULES)||'null'),
    day: JSON.parse(localStorage.getItem(SK_DAY+DDATE)||'{"e":0,"done":[]}'),
    sets: JSON.parse(localStorage.getItem(SK_SET)||`{"mx":5, "pin":"0000"}`),
    stats: JSON.parse(localStorage.getItem(SK_STATS)||'null'),
    weekHist: JSON.parse(localStorage.getItem(SK_WEEK)||'{}')
  };
  
  if(!S.stats) {
    let te = 0;
    S.hist.forEach(h => { if(h.t==='earn') te += h.v; });
    S.stats = { totalEarned: te, badges: [] };
    // Retro-compatibility (silent unlock for existing users without popup)
    BADGES_CFG.forEach(b => { if(te >= b.req) S.stats.badges.push(b.id); });
    sv(SK_STATS, S.stats);
  }
  
  if(!S.day || !Array.isArray(S.day.done)) S.day = {e:0, done:[]};
  if(!S.rews) { S.rews = BASE_REW; sv(SK_REW, S.rews); }
  if(!S.rules) { S.rules = BASE_RULES; sv(SK_RULES, S.rules); }
  
  const ageK = getAgeKey(P.age);
  if(!S.behs || !Array.isArray(S.behs) || S.behs.length === 0) { 
    console.warn("Grid empty or invalid, hydrating...", ageK);
    let defaults = AGE_BEHS[ageK] || AGE_BEHS['3-6'];
    S.behs = JSON.parse(JSON.stringify(defaults)); 
    sv(SK_BEH, S.behs); 
  }
  S.behs = S.behs.filter(b => b && b.id && b.l); // Safe filter
}
syncState();

// =============== RENDERING ===============
function renderAll() {
  if(P.age <= 6) {
    const starCount = Math.min(S.stars, 10);
    document.getElementById('totalStars').innerHTML = '⭐'.repeat(starCount) + (S.stars > 10 ? '<span style="font-size:24px;vertical-align:middle;">+</span>' : '');
  } else {
    document.getElementById('totalStars').textContent = S.stars;
  }
  
  let p = (S.day.e / S.sets.mx)*100;
  document.getElementById('dailyProgFill').style.width = Math.min(100, Math.max(0,p))+'%';
  document.getElementById('dailyStars').textContent = S.day.e;
  document.getElementById('maxStars').textContent = S.sets.mx;

  // Visual Stars (Daily Goal) with staggered animation
  let vs = '';
  for(let i=1; i<=S.sets.mx; i++) {
    const delay = i * 0.08;
    vs += `<span class="v-star ${i<=S.day.e?'on':''}" style="animation-delay:${delay}s">⭐</span>`;
  }
  let vsEl = document.getElementById('dailyVisualStars');
  if(vsEl) vsEl.innerHTML = vs;
  
  // Tirelire
  document.getElementById('bankStars').textContent = S.bank + '⭐';

  rBehs();
  rRews();
  rHist();
  rBadges();
  rWeek();
  rRules();
  if(P.age <= 12) ckGame();
  
  // Manage Lists for parent
  const bl = document.getElementById('behManageList');
  if(bl) bl.innerHTML = S.behs.map(b=>`<div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>${b.e} ${b.l} (${b.s}⭐)</span> <button onclick="delB('${b.id}')" style="color:red">X</button></div>`).join('');
  const rl = document.getElementById('rewManageList');
  if(rl) rl.innerHTML = S.rews.map(r=>`<div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>${r.e} ${rewLabel(r)} (${r.c}⭐)</span> <button onclick="delR('${r.id}')" style="color:red">X</button></div>`).join('');
  const rulL = document.getElementById('rulManageList');
  if(rulL) rulL.innerHTML = S.rules.map(r=>`<div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px"><span>${r.e} <b>${r.l}</b></span> <button onclick="delRule('${r.id}')" style="color:red">X</button></div>`).join('');

  // Save week day on each render
  saveWeekDay();
}

function rBehs() {
  const g = document.getElementById('behGrid');
  let ht = '';
  
  // All behaviors for this child (age-adapted, modifiable by parent)
  S.behs.forEach(b => {
    const done = S.day.done.includes(b.id);
    ht += `<div class="beh-card ${done?'done':''}" onclick="${done?'':`tapB('${b.id}', event)`}">
      <div class="ic">${b.e}</div><div class="lbl">${b.l}</div><div class="badge">+${b.s}⭐</div>
    </div>`;
  });
  
  // Dashboard Action to add quickly
  if(P.age <= 18) {
    ht += `<div class="beh-card" onclick="promptAddBehavior()" style="border:2px dashed var(--age-color); background:transparent; opacity:0.8; justify-content:center; box-shadow:none; display:flex !important;">
      <div class="ic" style="font-size:24px;">➕</div><div class="lbl" style="color:var(--text);font-weight:800;">${t('app_add_new')}</div>
    </div>`;
  }
  
  if(!ht) console.error("CRITICAL: rBehs generated no HTML for grid!");

  g.innerHTML = ht;
}

function rRews() {
  const l = document.getElementById('rewList');
  const sR = [...S.rews].sort((a,b)=>a.c - b.c);
  let ht = sR.map((r,i) => {
    const ul = S.stars >= r.c;
    const nx = !ul && (i===0 || S.stars >= sR[i-1].c);
    return `<div class="rew-item ${ul?'ul':nx?'nx':'lk'}" onclick="${ul?`tapR('${r.id}')`:''}" >
      <div class="rew-ic">${r.e}</div>
      <div class="rew-info"><div class="rew-title">${rewLabel(r)}</div></div>
      <div class="rew-cost">${r.c}⭐</div>
    </div>`;
  }).join('');

  // Floating + inside rewards too
  ht += `<div class="rew-item" onclick="promptAddReward()" style="border:2px dashed var(--age-color); background:transparent; opacity:0.6; justify-content:center; box-shadow:none; padding:10px;">
    <div class="rew-ic" style="font-size:20px;">➕</div><div class="rew-info"><div class="rew-title">${t('app_add_reward_label')}</div></div>
  </div>`;
  l.innerHTML = ht;
}

function rWeek() {
  const w = document.getElementById('weekBar');
  const dayNames = t('app_week_days');
  const curd = (new Date().getDay() + 6) % 7; // Lundi = 0
  
  // Get dates for this week
  const today = new Date();
  const monday = new Date(today);
  monday.setDate(today.getDate() - curd);
  
  w.innerHTML = dayNames.map((d, i) => {
    const dayDate = new Date(monday);
    dayDate.setDate(monday.getDate() + i);
    const dateStr = dayDate.toISOString().split('T')[0];
    
    let act = false;
    if(i === curd && S.day.e > 0) act = true;
    else if(i < curd && S.weekHist[dateStr] && S.weekHist[dateStr] > 0) act = true;
    
    return `<div class="w-day ${act?'act':''}">
      <div class="wd-l">${d}</div><div class="wd-d">⭐</div>
    </div>`;
  }).join('');
}

function mvBank(amt) {
  if(S.stars >= amt) {
    S.stars -= amt;
    S.bank += amt;
    S.hist.push({t:'use', e:'🏦', l:t('app_hist_savings'), v:amt, d:new Date().toLocaleString()});
    sv(SK_STARS, S.stars);
    sv(SK_BANK, S.bank);
    sv(SK_HIST, S.hist);
    renderAll();
    speak(t('app_robot_transfer_ok'));
    Robot.celebrate();
  } else {
    speak(t('app_robot_not_enough_short'));
  }
}

function finishSOS() {
  closeModals();
  S.day.e += 1; S.stars += 1;
  S.hist.push({t:'earn', e:'🧘', l:t('app_hist_crisis'), v:1, d:new Date().toLocaleString()});
  sv(SK_STARS, S.stars); sv(SK_DAY+DDATE, S.day); sv(SK_HIST, S.hist);
  renderAll();
  Robot.set('happy'); speak(t('app_robot_crisis'));
}

// =============== HELPER UTILS ===============
function applyRobotTheme(color) {
  const root = document.documentElement;
  root.style.setProperty('--robot-accent', color);
  const rgb = hexToRgb(color);
  if (rgb) {
    root.style.setProperty('--robot-accent-rgb', `${rgb.r},${rgb.g},${rgb.b}`);
    const body = shadeColor(color, -60);
    const dark = shadeColor(color, -80);
    root.style.setProperty('--robot-body', body);
    root.style.setProperty('--robot-dark', dark);
  }
}
function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? { r:parseInt(result[1], 16), g:parseInt(result[2], 16), b:parseInt(result[3], 16) } : null;
}
function shadeColor(color, percent) {
  let R = parseInt(color.substring(1,3),16);
  let G = parseInt(color.substring(3,5),16);
  let B = parseInt(color.substring(5,7),16);
  R = parseInt(R * (100 + percent) / 100);
  G = parseInt(G * (100 + percent) / 100);
  B = parseInt(B * (100 + percent) / 100);
  R = (R<255)?R:255; G = (G<255)?G:255; B = (B<255)?B:255;
  const RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
  const GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
  const BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));
  return "#"+RR+GG+BB;
}

// =============== CONFETTI ===============
function burstConfetti() {
  const container = document.createElement('div');
  container.className = 'confetti-burst';
  document.body.appendChild(container);
  const colors = ['#FFB800','#2ECC71','#00D4FF','#8B5CF6','#E8344A','#FF6B35'];
  for(let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-particle';
    const angle = (Math.PI * 2 / 20) * i;
    const dist = 80 + Math.random() * 120;
    p.style.setProperty('--cx', `${Math.cos(angle)*dist}px`);
    p.style.setProperty('--cy', `${Math.sin(angle)*dist - 60}px`);
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.left = '0px'; p.style.top = '0px';
    container.appendChild(p);
  }
  setTimeout(() => container.remove(), 1200);
}

function tapB(id, event) {

    const card = event.currentTarget;

    const rect = card.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (event.clientX - rect.left - size/2) + 'px';
    ripple.style.top = (event.clientY - rect.top - size/2) + 'px';
    card.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  }

  if(S.day.e >= S.sets.mx) { speak(t('app_robot_max_stars')); Robot.set('neutral'); return; }

function checkBadges(bPoints) {
  if(!S.stats) return;
  S.stats.totalEarned += bPoints;
  let newBadges = [];
  BADGES_CFG.forEach(b => {
    if(!S.stats.badges.includes(b.id) && S.stats.totalEarned >= b.req) {
      S.stats.badges.push(b.id);
      newBadges.push(b);
      S.stars += b.bonus;
      S.hist.push({t:'earn', e:'🏆', l:`${t('app_hist_trophy')}: ${t(b.lk)}`, v:b.bonus, d:new Date().toLocaleString()});
    }
  });
  sv(SK_STATS, S.stats);
  
  if(newBadges.length > 0) {
    const last = newBadges[newBadges.length-1];
    document.getElementById('bmEm').textContent = last.e;
    document.getElementById('bmT').textContent = t(last.lk);
    document.getElementById('bmD').textContent = `${t('app_badge_congrats')} ${last.bonus}⭐`;
    setTimeout(() => {
      document.getElementById('badgeModal').classList.add('open');
      Robot.celebrate();
      speak(t('app_robot_trophy'));
      renderAll();
    }, 2000);
  }
}

function handleSettingsPhotoUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX_SIZE = 200;
      let width = img.width; let height = img.height;
      if (width > height) {
        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
      } else {
        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
      }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/webp', 0.8);
      localStorage.setItem(`ekhio_photo_${PID}`, dataUrl);
      loadProfile(); // Refresh UI
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// Simple Runner Game Logic
const GC = document.getElementById('gameCanvas');
const GCTX = GC.getContext('2d');
let gameId = null, gScore=0, gLives=3;
let py = 200, pvy = 0, isJumping = false;
let obstacles = [];
let frames = 0;

function resetGame() {
  gScore=0; gLives=3; py=200; pvy=0; isJumping=false; obstacles=[]; frames=0;
  document.getElementById('gScore').textContent = 0;
  document.getElementById('gLives').textContent = '❤️❤️❤️';
}

function handleKeyPress(e) {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    // Prevent default scroll behavior when playing game
    e.preventDefault();
    jump(e);
  }
}

function startGame() {
  if(gameId) cancelAnimationFrame(gameId);
  resetGame();
  GC.addEventListener('touchstart', jump);
  GC.addEventListener('mousedown', jump);
  window.addEventListener('keydown', handleKeyPress);
  gameLoop();
}

function jump(e) { if(e && e.preventDefault) e.preventDefault(); if(!isJumping){ pvy = -14; isJumping = true; } }

function gameLoop() {
  GCTX.clearRect(0,0,GC.width,GC.height);
  frames++;

  // Draw Player (Robot)
  py += pvy; pvy += 0.8; // gravity
  if(py >= 200) { py = 200; isJumping = false; pvy = 0; }
  
  GCTX.fillStyle = P.avatar;
  GCTX.fillRect(50, py-30, 30, 30);
  // eye
  GCTX.fillStyle = '#000'; GCTX.fillRect(66, py-24, 8, 8);

  // Obstacles
  if(frames % 90 === 0) obstacles.push({x:GC.width, y:200, w:20, h:20});
  for(let i=obstacles.length-1; i>=0; i--) {
    const ob = obstacles[i];
    ob.x -= 4; // speed
    GCTX.fillStyle = '#E8344A';
    GCTX.fillRect(ob.x, ob.y-ob.h, ob.w, ob.h);

    // Collision
    if(ob.x < 80 && ob.x+ob.w > 50 && py > ob.y-ob.h) {
      gLives--;
      document.getElementById('gLives').textContent = '❤️'.repeat(Math.max(0,gLives));
      obstacles.splice(i,1);
      if(gLives<=0) {
        GCTX.fillStyle = '#1A1208'; GCTX.font = '24px Fredoka One'; GCTX.fillText(t('app_game_over'), 130, 100);
        window.removeEventListener('keydown', handleKeyPress);
        return; // stop loop
      }
    } else if(ob.x < 20) {
      obstacles.splice(i,1);
      gScore++; document.getElementById('gScore').textContent = gScore;
    }
  }

  // Floor
  GCTX.fillStyle = '#FFF9F0'; GCTX.fillRect(0, 200, GC.width, 50);

  gameId = requestAnimationFrame(gameLoop);
}

// iOS detection for PWA install guidance
function checkIOSInstall() {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.navigator.standalone === true;
  if(isIOS && !isStandalone && !localStorage.getItem('ekhio_pwa_dismissed')) {
    const banner = document.getElementById('pwa-install-banner');
    if(banner) {
      banner.style.display = 'block';
      const msg = document.getElementById('pwa-install-msg');
      if(msg) msg.textContent = t('pwa_ios_instruction');
      // Hide the install button on iOS (they use Share > Add to Home Screen)
      const btn = document.getElementById('pwa-install-btn');
      if(btn) btn.style.display = 'none';
    }
  }
}
